name: Daily Camp News Update

on:
  schedule:
    # 毎日日本時間の朝9:00（UTC 0:00）に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でも実行できるようにする

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python make_summary.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json camp_summary.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update camp news" && git push)
